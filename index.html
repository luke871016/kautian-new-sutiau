tion":"時運不佳。也指賭博的手氣不好。","examples":[{"hanzi":"近來真䆀氣，凡事著愛較細膩咧。","tailo":"Kīn-lâi tsin bái-khuì, huân-sū tio̍h-ài khah sè-jī--leh.","mandarin":"最近運氣不佳，凡事得要小心謹慎一點。"},{"hanzi":"下昏真䆀氣，拍麻雀一直放銃。","tailo":"E-hng tsin bái-khuì, phah-muâ-tshiok it-ti̍t pàng-tshìng.","mandarin":"今晚手氣很背，打麻將一直放槍。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14506","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14556,"newId":14505,"hanzi":"䆀豆仔","tailo":"bái-tāu-á","wordType":"主詞目","senses":[{"pos":"名詞","definition":"粉豆、醜豆。和「敏豆仔」（四季豆）豆莢長度相近，同屬於豆科菜豆屬（但是豆莢很長的「菜豆仔」是豆科豇豆屬）。「敏豆仔」是圓莢型；而「䆀豆仔」是扁莢型，市面上有兩種，一種豆莢較薄，一種較厚。因為外觀易凹凸扭曲，不甚美觀，所以戲稱為「䆀豆仔」，具粉嫩口感，所以也稱為「粉豆」。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14505","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13910,"newId":13870,"hanzi":"一必一中","tailo":"it-pit-it-tiòng","wordType":"主詞目","senses":[{"pos":"熟語","definition":"每次所說或所做都不曾失誤。非常精準、準確。","examples":[{"hanzi":"這个師傅的寸步，逐過攏嘛做甲一必一中。","tailo":"Tsit ê sai-hū ê tshùn-pōo, ta̍k-kuè lóng mā tsò kah it-pit-it-tiòng.","mandarin":"這個師傅的尺寸，每次都做得非常精準。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13870","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14632,"newId":14577,"hanzi":"一時仔","tailo":"tsi̍t-sî-á","wordType":"主詞目","senses":[{"pos":"時間詞","definition":"一下子。一段不長的時間。","examples":[{"hanzi":"虹誠媠，毋過一時仔就無去矣。","tailo":"Khīng tsiânn suí, m̄-koh tsi̍t-sî-á tō bô--khì--ah.","mandarin":"彩虹很漂亮，不過一下子就不見了。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14577","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13909,"newId":13869,"hanzi":"一疕仔","tailo":"tsi̍t-phí-á","wordType":"主詞目","senses":[{"pos":"形容詞","definition":"一小片、一點點。形容微不足道，帶有貶義。","examples":[{"hanzi":"一人才分一疕仔，連楔喙齒縫都無夠。","tailo":"Tsi̍t lâng tsiah pun tsi̍t-phí-á, liân seh tshuì-khí-phāng to bô-kàu.","mandarin":"一人才分得一點點，連塞牙縫都不夠。"},{"hanzi":"你莫看伊人一疕仔囝，伊力頭真飽喔！","tailo":"Lí mài khuànn i lâng tsi̍t-phí-á-kiánn, i la̍t-thâu tsin pá zi":"作穡人共採收了的荷蘭豆分做三級：䆀的、中範的、媠的。","tailo":"Tsoh-sit-lâng kā tshái-siu liáu ê huê-liân-tāu hun-tsò sann kip, bái--ê, tiong-pān--ê, suí--ê.","mandarin":"農人將採收完的豌豆分成三級：品相不佳的、中等的、優良的。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13901","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13994,"newId":13954,"hanzi":"主顧客","tailo":"tsú-kòo-kheh","wordType":"主詞目","senses":[{"pos":"名詞","definition":"主顧、常客。","examples":[{"hanzi":"咱店的生理，攏是主顧客鬥捀場，才有穩定的收入。","tailo":"Lán tiàm ê sing-lí, lóng sī tsú-kòo-kheh tàu phâng-tiûnn, tsiah ū ún-tīng ê siu-ji̍p.","mandarin":"我們店裡的生意，全靠主顧幫忙捧場，才有穩定的收入。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13954","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13923,"newId":13883,"hanzi":"久年","tailo":"kú-nî","wordType":"主詞目","senses":[{"pos":"形容詞","definition":"多年、積年。","examples":[{"hanzi":"久年的心願","tailo":"kú-nî ê sim-guān","mandarin":"多年的心願"},{"hanzi":"這久年症頭矣，著愛耐心治療，沓沓仔調養，才會見效。","tailo":"Tse kú-nî tsìng-thâu--ah, tio̍h-ài nāi-sim tī-liâu, ta̍uh-ta̍uh-á tiâu-ióng, tsiah ē kiàn-hāu.","mandarin":"這是老毛病了，得要耐心治療，慢慢調養，才會見效。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13883","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13942,"newId":13902,"hanzi":"五子直","tailo":"gōo-jí-ti̍t/gōo-lí-ti̍t","wordType":"主詞目","senses":[{"pos":"名詞","definition":"五子棋。一種棋類遊戲。用棋子在畫有縱橫格子的棋盤上對弈，先把五個棋子連成一條線者為優勝。","examples":[{"hanzi":"教囡仔行五子直，會當提升𪜶的智力。","tailo":"Kà gín-á kiânn gōo-jí-ti̍t, ē-tàng thê-sing in ê tì-li̍k.","mandarin":"教孩子下五子棋，可以提升他們的智力。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13902","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14031,"newId":13991,"hanzi":"交繃","tailo":"kau-penn/kau-pinn","wordType":"主詞目","senses":[{"pos":"形容詞","definition":"愛挑剔、計較，喜歡唱反調，讓人感到為難。","examples":[{"hanzi":"伊真交繃，正經叫伊主意伊閣毋敢。","tailo":"I tsin kau-penn, tsìng-king kiò i tsú-ì i koh m̄ kánn.","mandarin":"他很愛挑剔、唱反調，當真要他做主他又不敢。"}]},{"pos":"動詞","definition":"因為不滿而與人 ples":[{"hanzi":"咱兩个人差無幾歲，算起來是仝沿的。","tailo":"Lán nn̄g ê lâng tsha bô kuí huè, sǹg--khí-lâi sī kāng-iân--ê.","mandarin":"咱們兩個人相差沒幾歲，算起來是同輩。"},{"hanzi":"雖然我佮恁阿爸平歲，毋過論輩無論歲，咱算仝沿的，叫我阿兄就好。","tailo":"Sui-jiân guá kah lín a-pah pênn huè, m̄-koh lūn puè bô lūn huè, lán sǹg kāng-iân--ê, kiò guá a-hiann tō hó.","mandarin":"雖然我和你爸爸同年齡，但是論輩份不論年紀，咱們算同輩，叫我哥哥就好。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13956","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14641,"newId":14586,"hanzi":"以早","tailo":"í-tsá","wordType":"主詞目","senses":[{"pos":"時間詞","definition":"以前、從前。","examples":[{"hanzi":"以早遮是田，這馬做停車場，聽講以後欲起厝。","tailo":"Í-tsá tsia sī tshân, tsit-má tsò thîng-tshia-tiûnn, thiann-kóng í-āu beh khí-tshù.","mandarin":"以前這裡是田，現在當停車場，聽說以後要蓋房子。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14586","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14074,"newId":14034,"hanzi":"伸捙","tailo":"tshun-tshia","wordType":"主詞目","senses":[{"pos":"形容詞","definition":"(說)清楚使談話對象理解並接受。","examples":[{"hanzi":"免佮伊講，佮伊講，講袂伸捙。","tailo":"Bián kah i kóng, kah i kóng, kóng bē tshun-tshia.","mandarin":"不用跟他說，跟他說，說不清楚。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14034","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14505,"newId":14457,"hanzi":"佈田花","tailo":"pòo-tshân-hue","wordType":"主詞目","senses":[{"pos":"名詞","definition":"杜鵑花。植物名。常綠灌木或落葉灌木，植株低矮，葉為互生或簇生，喜好陰涼、溼潤的環境。春天插秧時開花，才有「佈田花」之名。因為長滿絨毛的葉片，既能調節水分又能吸住灰塵，不怕都市污濁的空氣，常見栽植於公園或道路旁安全島，發揮清淨空氣的功能。為臺北市、新竹市的市花。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14457","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14075,"newId":14035,"hanzi":"低路師","tailo":"kē-lōo-sai","wordType":"主詞目","senses":[{"pos":"名詞","definition":"技藝很差的工匠，引申泛指能力很差的人。","examples":[{"hanzi":"幼路工課低路師做無路來。","tailo":"Iù-lōo khang-khuè kē-lōo-sai tsò bô-lōo-lâi.","mandarin":"精細的工作能力很差的人做不來。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14035","missingInOds":fal o-pô hōo.","mandarin":"民間傳說保生大帝曾向媽祖求婚，但是媽祖一心掛念人民，拒絕了大帝的美意。大帝非常失望，也很生氣，就在農曆三月二十三日媽祖誕辰繞境時，施法術、降大雨。到了翌年三月十五日大帝誕辰遶境時，媽祖就颳起大風。"}]},{"pos":"名詞","definition":"媽祖婆。現今有用來稱呼像母親、祖母，婆婆般親切慈祥待人的年長女子。借用媽祖庇佑信徒，溫和慈祥、包容關懷的形象，而「婆」是指年長婦女。","examples":[{"hanzi":"逐家攏叫厝主「媽祖婆」，有伊佇咧，絕對袂枵著！","tailo":"Ta̍k-ke lóng kiò tshù-tsú “Má-tsóo-pô”, ū i tī--leh, tsua̍t-tuì bē iau--tio̍h!","mandarin":"大家都叫房東「媽祖婆」，有他在，絕對不會挨餓！"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14368","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14047,"newId":14007,"hanzi":"字勻","tailo":"jī-ûn/lī-ûn","wordType":"主詞目","senses":[{"pos":"名詞","definition":"輩份、輩行。指宗族內子孫的輩份排行，一般以詩文形式編成其字輩，同輩子孫取該詩文中的同一字作為其名的前字，下一輩則取詩文的下一字，依序而下。","examples":[{"hanzi":"仝字勻","tailo":"kāng jī-ûn","mandarin":"輩份相同"},{"hanzi":"𪜶家族的查埔囡仔有照字勻號名，查某囡仔無。","tailo":"In ka-tso̍k ê tsa-poo gín-á ū tsiàu jī-ûn hō-miâ, tsa-bóo gín-á bô.","mandarin":"他們家族的男孩子照輩份取名，女孩子沒有。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14007","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14088,"newId":14048,"hanzi":"孝尾囝","tailo":"hà-bué-kiánn/hà-bé-kiánn","wordType":"主詞目","senses":[{"pos":"名詞","definition":"遺腹子。婦人懷孕之後，丈夫不久過世，所生的子女。","examples":[]},{"pos":"名詞","definition":"引申為罵人不長進。","examples":[{"hanzi":"恁爸母生甲你這个孝尾囝，有夠了然。","tailo":"Lín pē-bú senn kah lí tsit ê hà-bué-kiánn, ū-kàu liáu-jiân.","mandarin":"你父母生了你這個不長進的傢伙，真是枉然。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14048","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14089,"newId":14049,"hanzi":"孝男面","tailo":"hàu-lâm-bīn","wordType":"主詞目","senses":[{"pos":"名詞","definition":"哭喪著臉。帶有貶意的說法。","examples":[{"hanzi":"孝男面，無人緣。","tailo":"Hàu-lâm-bīn, bô-lâng-iân.","mandarin":"哭喪著臉，人緣不佳。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14049","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14120,"newId":14080,"hanzi":"孤佬","tailo":"koo-láu","wordType":"主詞目","senses":[{"pos":"形容詞","definition":"孤僻。","examples":[{ i/su/14317","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14365,"newId":14318,"hanzi":"惡質","tailo":"ok-tsit","wordType":"主詞目","senses":[{"pos":"形容詞","definition":"惡劣、邪惡、壞透、居心不良。","examples":[{"hanzi":"彼个頭家蓋惡質，工廠刁工放予倒，家己走去外國享受。","tailo":"Hit ê thâu-ke kài ok-tsit, kang-tshiúnn thiau-kang pàng hōo tó, ka-kī tsáu-khì guā-kok hiáng-siū.","mandarin":"那個老板超惡劣，工廠故意放任它倒閉，自己跑到外國去享受。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14318","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14418,"newId":14370,"hanzi":"想欲","tailo":"siūnn-beh","wordType":"主詞目","senses":[{"pos":"動詞","definition":"想要（什麼東西，或做某事）。","examples":[{"hanzi":"我想欲去便所。","tailo":"Guá siūnn-beh khì piān-sóo.","mandarin":"我想要上廁所。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14370","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14664,"newId":14608,"hanzi":"想講","tailo":"siūnn-kóng","wordType":"主詞目","senses":[{"pos":"動詞","definition":"想、思考、思量。","examples":[{"hanzi":"我想講已經暗矣，歹勢共你攪吵。","tailo":"Guá siūnn-kóng í-king àm--ah, pháinn-sè kā lí kiáu-tshá.","mandarin":"我想已經很晚了，不好意思打擾你。"}]},{"pos":"動詞","definition":"認為、覺得、猜想，心中有這樣的想法。","examples":[{"hanzi":"逐家攏想講伊應該會贏，早就準備欲共伊恭喜矣。","tailo":"Ta̍k-ke lóng siūnn-kóng i ing-kai ē iânn, tsá tō tsún-pī beh kā i kiong-hí--ah.","mandarin":"大家都覺得他會贏，早就準備向他恭賀了。"}]},{"pos":"動詞","definition":"打算、預計。","examples":[{"hanzi":"我才想講欲去揣你，你就敲電話來矣。","tailo":"Guá tsiah siūnn-kóng beh khì tshuē--lí, lí tō khà tiān-uē lâi--ah.","mandarin":"我正打算要去找你，你就打電話來了。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14608","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14583,"newId":14528,"hanzi":"懵膽","tailo":"bòng-tánn","wordType":"主詞目","senses":[{"pos":"形容詞","definition":"顧頭不顧尾的、無懼無慮的。行事莽撞大膽。","examples":[{"hanzi":"伊做代誌懵膽懵膽，咱著閣替伊收尾。","tailo":"I tsò tāi-tsì bòng-tánn-bòng-tánn, lán tio̍h koh thè i siu-bué.","mandarin":"他做事顧頭不顧尾的，咱們還得幫他善後。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14528","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14587,"newId":14532,"hanzi":"懸頂","tailo":"kuân-tíng","wordType":"主詞目","senses":[{"pos":"方位詞","definition":"上面、上頭。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14532","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14617,"newId":14562,"hanzi":"戇目","tailo":"gōng-ba̍k","wordType":"主詞目","senses":[{"pos":"形容詞","definition":"眼力遲鈍、認不出人。","examples":[{"hanzi":"你是阿榮喔！歹勢，我真戇目。","tailo":"Lí sī A-îng--ooh! Pháinn-sè, guá tsin gōng-ba̍k.","mandarin":"你是阿榮喔！不好意思，我眼拙得很。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14562","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14049,"newId":14009,"hanzi":"成格","tailo":"tshiânn-kik","wordType":"主詞目","senses":[{"pos":"動詞","definition":"室內隔間裝潢。","examples":[{"hanzi":"厝起好，內面著成格。","tailo":"Tshù khí-hó, lāi-bīn tio̍h tshiânn-kik.","mandarin":"房子蓋好後，室內必須隔間裝潢。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14009","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14558,"newId":14507,"hanzi":"戲籠","tailo":"hì-láng","wordType":"主詞目","senses":[{"pos":"名詞","definition":"戲箱。戲班裝服裝、道具的大箱子。","examples":[{"hanzi":"看戲看甲扛戲籠。","tailo":"Khuànn hì khuànn kah kng hì-láng.","mandarin":"愛看戲的戲迷竟然去幫戲班扛戲箱。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14507","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14559,"newId":14508,"hanzi":"戴小鬼仔殼","tailo":"tì siáu-kuí-á-khak","wordType":"主詞目","senses":[{"pos":"熟語","definition":"戴著鬼臉面具，比喻羞於見人。","examples":[{"hanzi":"我若做彼種代誌，後擺出門毋就愛戴小鬼仔殼。","tailo":"Guá nā tsò hit tsióng tāi-tsì, āu-pái tshut-mn̂g m̄-tō ài tì siáu-kuí-á-khak.","mandarin":"我要是做那種事，以後出門不就得戴著面具了嗎。"}]},{"pos":"熟語","definition":"比喻人表裡不一。","examples":[{"hanzi":"伊戴小鬼仔殼咧做人，喙無迵心肝，袂信用得。","tailo":"I tì siáu-kuí-á-khak teh tsò-lâng, tshuì bô thàng sim-kuann, bē-sìn-iōng--tit.","mandarin":"他為人處世好像戴著面具，心口不一，不能信任。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14508","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13961,"newId":13921,"hanzi":"手後曲","tailo":"tshiú-āu-khiau","wordType":"主詞目","senses":[{"pos":"名詞","definition":"手肘外側。","examples":[{"hanzi":"伊用手後曲共我㧎撞一下，暗示我伊欲先離開一下。","tailo":"I īng tshiú-āu-khiau kā guá khê tōng--tsi̍t-ē, àm-sī guá i beh sing lī-khui--tsi̍t-ē.","mandarin":"他用手肘碰我一下，暗示我他要先離開一下。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13921","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13959,"newId":13919,"hanzi":"手爪賤","tailo":"tshiú-jiáu-tsiān/tshiú-niáu-tsiān","wordType":"主詞目","senses":[{"pos":"熟語","definition":"手腳不乾淨，有順手牽羊或偷竊習慣的。","examples":[{"hanzi":"這个人手爪賤，咱物件愛較斟酌咧。","tailo":"Tsit ê lâng tshiú-jiáu-tsiān, lán mi̍h-kiānn ài khah tsim-tsiok--leh.","mandarin":"這個人手腳不乾淨，我們東西要多加注意。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13919","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13965,"newId":13925,"hanzi":"手縫櫳","tailo":"tshiú-phāng lang","wordType":"主詞目","senses":[{"pos":"熟語","definition":"手指間的縫隙大，民俗命理認為有這種手相的人容易漏財。引申形容出手大方，愛花錢的人。","examples":[{"hanzi":"相命仙共伊看手相講：「手縫櫳，財產空，隨趁隨空空。」","tailo":"Siòng-miā-sian kā i khuànn tshiú-siòng kóng, “Tshiú-phāng lang, tsâi-sán khang, suî thàn suî khang-khang.”","mandarin":"算命先生看了他的手相後說：「手指間縫隙大，財產空，馬上賺馬上空。」"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13925","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13960,"newId":13920,"hanzi":"手股頭","tailo":"tshiú-kóo-thâu","wordType":"主詞目","senses":[{"pos":"名詞","definition":"上臂近肩的外側部份。","examples":[{"hanzi":"伊的手股頭有刺字，穿吊䘥仔就看現現。","tailo":"I ê tshiú-kóo-thâu ū tshiah-jī, tshīng tiàu-kah-á tō khuànn-hiān-hiān.","mandarin":"他的上手臂有刺青，穿無袖內衣就看得清清楚楚。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13920","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13963,"newId":13923,"hanzi":"手賤","tailo":"tshiú-tsiān","wordType":"主詞目","senses":[{"pos":"動詞","definition":"手癢。指一看到東西就 nd-hani/su/14201","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14248,"newId":14202,"hanzi":"挽筋","tailo":"bán-kin/bán-kun","wordType":"主詞目","senses":[{"pos":"動詞","definition":"一種民俗療法，遇人有中暑、頭暈、腹脹等痧症時，用雙指沾水為其捏擰肩頸或脊椎兩側的筋絡，使皮膚紅紫、局部充血，以增進氣血循環、舒緩症狀。類似「刮痧」療法的效果。","examples":[]},{"pos":"動詞","definition":"拉扯筋肉，有時指痙攣。若說「挽著筋」(bán-tio̍h kin)或「筋去挽著」(kin khì bán--tio̍h)是動作不慎或受到外力而扭傷筋肉。若說「筋挽倚來」(kin bán-uá--lâi)是發生痙攣。","examples":[{"hanzi":"跤手挽筋","tailo":"kha-tshiú bán-kin","mandarin":"手腳痙攣"},{"hanzi":"挽筋捘頷","tailo":"bán-kin-tsūn-ām","mandarin":"拉筋扭頸，表現出不耐煩、不在乎的樣子"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14202","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14249,"newId":14203,"hanzi":"捙倒","tailo":"tshia-tó","wordType":"主詞目","senses":[{"pos":"動詞","definition":"打翻杯碗等容器，導致所裝的水、食物等倒瀉出來。","examples":[{"hanzi":"捙倒茶","tailo":"tshia-tó tê","mandarin":"打翻茶水"},{"hanzi":"伊無細膩甌仔捙倒，煞予燒茶燙著。","tailo":"I bô-sè-jī au-á tshia--tó, suah hōo sio tê thǹg--tio̍h.","mandarin":"不小心打翻茶杯，就被熱茶燙著了。"},{"hanzi":"捙倒人的飯碗","tailo":"tshia-tó lâng ê pn̄g-uánn","mandarin":"打翻人家的飯碗，比喻害人家丟了工作"},{"hanzi":"捙倒醋甕","tailo":"tshia-tó tshòo-àng","mandarin":"打翻醋罈子，形容醋勁大發"}]},{"pos":"動詞","definition":"推翻。用力將豎立著的東西推倒，推翻。","examples":[{"hanzi":"人民捙倒獨裁者的銅像。","tailo":"Jîn-bîn tshia-tó to̍k-tshâi-tsiá ê tâng-siōng.","mandarin":"人民推倒獨裁者的銅像。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14203","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14322,"newId":14275,"hanzi":"捾定","tailo":"kuānn-tiānn","wordType":"主詞目","senses":[{"pos":"動詞","definition":"男方擇定吉日，第一次向女家致送訂婚聘禮。","examples":[{"hanzi":"李家明仔載欲來捾定，咱著辦腥臊請人。","tailo":"Lí--ka bîn-á-tsài beh lâi kuānn-tiānn, lán tio̍h pān tshenn-tshau tshiánn--lâng.","mandarin":"李家明天要來下聘，我們要張羅豐盛的酒菜宴請人家。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14275","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14323,"newId":14276,"hanzi":"推捒","tailo":"the-sak","wordType":"主詞目" áu pāi-bé, m̄-bián sit-tsì.","mandarin":"事業若經營失敗了，不用氣餒不振。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14277","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14367,"newId":14320,"hanzi":"敢是","tailo":"kám-sī","wordType":"主詞目","senses":[{"pos":"疑問詞","definition":"疑問詞，用來表達是非、正反提問問句。","examples":[{"hanzi":"伊敢是老師？","tailo":"I kám-sī lāu-su?","mandarin":"他是老師嗎？"}]},{"pos":"疑問詞","definition":"難道是、豈是。用來表達反問問句，一般的語調會提高或是加強那句話的語氣。","examples":[{"hanzi":"敢是按呢？","tailo":"Kám-sī án-ne?","mandarin":"是這樣子嗎？"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14320","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14368,"newId":14321,"hanzi":"敢是","tailo":"kánn-sī","wordType":"主詞目","senses":[{"pos":"副詞","definition":"大概是、恐怕是。用於表達臆測、不太有把握的判斷。","examples":[{"hanzi":"敢是欲落雨矣。","tailo":"Kánn-sī beh lo̍h-hōo--ah.","mandarin":"大概是要下雨了。"},{"hanzi":"伊敢是有啥物不得已的苦衷，才會做出這種代誌。","tailo":"I kánn-sī ū siánn-mih put-tik-í ê khóo-thiong, tsiah ē tsò-tshut tsit tsióng tāi-tsì.","mandarin":"他恐怕是有什麼不得已的苦衷，才會做出這種事情。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14321","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14369,"newId":14322,"hanzi":"敨放","tailo":"tháu-pàng","wordType":"主詞目","senses":[{"pos":"動詞","definition":"鬆綁。","examples":[{"hanzi":"伊偷提厝裡的錢，予阿公縛咧，啥人敢共伊敨放？","tailo":"I thau-the̍h tshù--lí ê tsînn, hōo a-kong pa̍k--leh, siánn-lâng kánn kā i tháu-pàng?","mandarin":"他偷拿家裡的錢，被祖父綁著，誰敢幫他鬆綁？"}]},{"pos":"動詞","definition":"解放。解除束縛，使自由發展。","examples":[{"hanzi":"臺灣人的想法敢有得著敨放？","tailo":"Tâi-uân-lâng ê siūnn-huat kám ū tit-tio̍h tháu-pàng?","mandarin":"臺灣人的想法得到解放了嗎？"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14322","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14160,"newId":14120,"hanzi":"文光尺","tailo":"bûn-kong-tshioh","wordType":"主詞目","senses":[{"pos":"名詞","definition":"小木匠師所用的尺，長度為一尺四寸四，其上刻有「財病離義官劫害本」八格的吉凶尺寸，多用於丈量門窗，一般的師傅常將「文光尺」和「魯班尺(魯班公尺)」視作相同的尺，但也有不同地方的師傅認定兩者是不同的尺。門光尺為陽宅所用，陰 zi":"佇臺灣，漳泉濫已經真普遍，四界攏聽會著。","tailo":"Tī Tâi-uân, Tsiang-Tsuân-lām í-king tsin phóo-phiàn, sì-kè lóng thiann ē tio̍h.","mandarin":"在臺灣，漳泉相混的口音已經很普遍，到處都聽得到。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14444","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14529,"newId":14479,"hanzi":"激骨話","tailo":"kik-kut-uē","wordType":"主詞目","senses":[{"pos":"名詞","definition":"故意說與人不同的話。","examples":[{"hanzi":"激骨話刁工共話意藏佇話裡，予聽的人去掠話骨。","tailo":"Kik-kut-uē thiau-kang kā uē-ì tshàng tī uē--lí, hōo thiann ê lâng khì lia̍h uē-kut.","mandarin":"歇後語故意把話意藏在話裡，讓聽的人去抓話裡的重點。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14479","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14592,"newId":14537,"hanzi":"灇水","tailo":"tsâng-tsuí","wordType":"主詞目","senses":[{"pos":"熟語","definition":"沖水。","examples":[{"hanzi":"熱人豬哥愛灇水，才袂熱著。","tailo":"Jua̍h--lâng ti-ko ài tsâng-tsuí, tsiah bē jua̍h--tio̍h.","mandarin":"夏天配種用的雄性豬隻需要沖水，才不會中暑。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14537","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13984,"newId":13944,"hanzi":"火母","tailo":"hué-bó/hé-bú","wordType":"主詞目","senses":[{"pos":"名詞","definition":"火種。供引火用的火。","examples":[{"hanzi":"火母欲熄去囉！","tailo":"Hué-bó beh sit--khì--looh!","mandarin":"火種快熄滅了。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13944","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13988,"newId":13948,"hanzi":"火烌性","tailo":"hué-hu-sìng/hé-hu-sìng","wordType":"主詞目","senses":[{"pos":"名詞","definition":"火暴性子、火暴脾氣。指脾氣容易暴躁，但跟火花一樣來得快去也快。","examples":[{"hanzi":"這个人是火烌性，較會得失人。","tailo":"Tsit ê lâng sī hué-hu-sìng, khah ē tik-sit--lâng.","mandarin":"這個人是火暴性子，比較容易得罪人。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13948","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13989,"newId":13949,"hanzi":"火珠仔","tailo":"hué-tsu-á/hé-tsu-á","wordType":"主詞目","senses":[{"pos":"名詞","definition":"火星塞。汽機車引擎的點火裝置。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13949","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13985,"newId":13945,"hanzi":"火車母","tailo":"hué-tshia-bó/hé-tshia-bú","wordType":"主詞目","senses":[{"pos":"名詞","definition":"火車頭、機關車。一種用來提供鐵路列車動力的鐵路車輛，它的作用是在軌道上驅動列車。又稱「車母」。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13945","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13986,"newId":13946,"hanzi":"火車頭","tailo":"hué-tshia-thâu/hé-tshia-thâu","wordType":"主詞目","senses":[{"pos":"名詞","definition":"火車站。","examples":[{"hanzi":"等咧咱佇火車頭的前驛相等，做伙坐後一幫火車上北。","tailo":"Tán--leh lán tī hué-tshia-thâu ê tsîng-ia̍h sio-tán, tsò-hué tsē āu tsi̍t pang hué-tshia tsiūnn-pak.","mandarin":"等一下我們在火車站的前站見，一起坐下一班火車北上。"}]},{"pos":"名詞","definition":"火車頭、機關車。一種用來提供鐵路列車動力的鐵路車輛，它的作用是在軌道上驅動列車。又稱「火車母」、「車母」。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13946","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":13987,"newId":13947,"hanzi":"火金星","tailo":"hué-kim-tshenn/hé-kim-tshinn","wordType":"主詞目","senses":[{"pos":"名詞","definition":"螢火蟲。昆蟲，身體呈黃褐色，腹部尾端會發出燐光，白天藏在草叢裡，晚上才飛出來。","examples":[{"hanzi":"熱天暗時佇山頂看火金星閃閃爍爍的光景是一款享受。","tailo":"Jua̍h-thinn àm-sî tī suann-tíng khuànn hué-kim-tshenn siám-siám-sih-sih ê kong-kíng sī tsi̍t khuán hiáng-siū.","mandarin":"夏天夜晚在山上看螢火蟲一閃一閃的光景是一種享受。"}]},{"pos":"名詞","definition":"火花、火星。物體燃燒或碰撞時所迸射的火點。也指身體發生異狀時，眼前出現像火星的感覺。","examples":[{"hanzi":"兩條電線相拍電，出火金星。","tailo":"Nn̄g tiâu tiān-suànn sio-phah-tiān, tshut hué-kim-tshenn.","mandarin":"兩條電線發生短路，冒出火花。"},{"hanzi":"我無細膩去跋一倒，目睭出火金星，差一屑仔就昏倒。","tailo":"Guá bô-sè-jī khì pua̍h tsi̍t tó, ba̍k-tsiu tshut hué-kim-tshenn, tsha tsi̍t-sut-á tō hūn--tó.","mandarin":"我不小心摔了一跤，眼冒金星，差一點昏倒。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13947","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14142,"newId":14102,"hanzi":"炊粉","tailo":"tshue-hún/tshe-hún","wordType":"主詞目","senses":[{"pos":"名詞","definition":"細米粉。也稱作「幼米粉」。製做米粉時先把米磨成漿，再壓乾後下去蒸三分熟成了富彈性的米團，將它輾成米片放入機器的細孔中，壓出一條條的生米粉。細長的米粉是要在蒸籠裡面蒸，所以叫「炊粉」，為新竹地區詞彙；而粗短的米粉要在水裡面煮，叫做「水粉」。兩者都是用百分百純米製造的「米粉」。","examples":[]},{"pos":"名詞","definition":"炊粉。2014年7月政府要求標示含米量，因而對名稱有了新規定。要求米粉含米量百分之五十以上才能使用米粉名稱；未達百分之五十者不應使用米粉名稱。由於市售米粉添加玉米粉較多，米含量大多低於百分之五十，所以這一類細米粉改稱為「炊粉」。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14102","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14190,"newId":14149,"hanzi":"為非糝做","tailo":"uî-hui-sám-tsò","wordType":"主詞目","senses":[{"pos":"熟語","definition":"胡作非為、為非作歹。","examples":[{"hanzi":"為非糝做，無好尾。","tailo":"Uî-hui-sám-tsò, bô hó-bué.","mandarin":"胡作非為，不得善終。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14149","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14259,"newId":14212,"hanzi":"烏子仔菜","tailo":"oo-tsí-á-tshài","wordType":"主詞目","senses":[{"pos":"名詞","definition":"龍葵。草本植物。葉互生，橢圓形，葉緣也有呈波狀，花白色，漿果球形，成熟時為黑色。可用做藥物。嫩葉為一種野生蔬菜，炒或作湯皆可。","examples":[{"hanzi":"烏子仔菜除了做野菜以外，伊結的果到分變烏了後，嘛是阮的四秀仔。","tailo":"Oo-tsí-á-tshài tû-liáu tsò iá-tshài í-guā, i kiat ê kó kàu-hun piàn oo liáu-āu, mā sī guán ê sì-siù-á.","mandarin":"龍葵可當野菜外，它結的果實成熟變黑後，也是我們的零嘴。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14212","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14261,"newId":14214,"hanzi":"烏尾冬","tailo":"oo-bué-tang/oo-bé-tang","wordType":"主詞目","senses":[{"pos":"名詞","definition":"雙帶鱗鰭烏尾鮗。一種食用帶赤色的海水魚。","examples":[{"hanzi":"烏尾冬，較好食赤鯮。","tailo":"Oo-bué-tang, khah hó tsia̍h tshiah-tsang.","mandarin":"俗語，當令便宜的新鮮漁獲比不當令的高級漁貨好吃。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14214","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14260,"newId":14213,"hanzi":"烏白切","tailo":"oo-pe̍h-tshiat","wordType":"主詞目","senses":[{"pos":"名詞","definition":"一種小吃。白水燙豬內臟、紅色粉腸、鯊魚煙、涼筍、章魚、透抽、魚卵、冷蟹、沙拉筍等等小菜，種類千變萬化，切塊沾蒜茸醬油吃。","examples":[{"hanzi":"臺北人講烏白切，嘉義人講滷熟肉。","tailo":"Tâi-pak-lâng kóng oo-pe̍h-tshiat, Ka-gī-lâng kóng u pe̍h-ba̍k!","mandarin":"他已經在生氣了，你還故意挖苦他，真是太不識相了！"}]},{"pos":"形容詞","definition":"形容孩子淘氣、搗蛋。","examples":[{"hanzi":"囡仔人毋通遐白目。","tailo":"Gín-á-lâng m̄-thang hiah pe̍h-ba̍k.","mandarin":"小孩子不要那麼淘氣。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13979","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14021,"newId":13981,"hanzi":"白菜滷","tailo":"pe̍h-tshài-lóo","wordType":"主詞目","senses":[{"pos":"名詞","definition":"傳統家常小菜，以大白菜為主，加些香菇、蝦米、雞蛋、紅蘿蔔、黑木耳、金針菇、豆皮等，燜煮到大白菜軟爛。","examples":[{"hanzi":"白菜滷是阮大家的手路菜，阮兜逐家攏真愛食。","tailo":"Pe̍h-tshài-lóo sī guán ta-ke ê tshiú-lōo-tshài, guán tau ta̍k-ke lóng tsin ài tsia̍h.","mandarin":"滷白菜是我婆婆的拿手菜，我家每個人都很愛吃。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13981","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14020,"newId":13980,"hanzi":"白虎湯","tailo":"pe̍h-hóo-thng","wordType":"主詞目","senses":[{"pos":"名詞","definition":"中藥的一種處方，成分為：知母、甘草、石膏、粳米。有解熱退燒的功效，屬於猛藥，使用不當可能致命。","examples":[]},{"pos":"名詞","definition":"通稱猛藥，引申指不得已時所採取的激烈手段。","examples":[{"hanzi":"拚白虎湯","tailo":"piànn pe̍h-hóo-thng","mandarin":"病入膏肓時，孤注一擲地拼最後一帖猛藥。也比喻採取激烈手段來試圖挽救情勢"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13980","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14022,"newId":13982,"hanzi":"白話字","tailo":"Pe̍h-uē-jī/Pe̍h-uē-lī","wordType":"主詞目","senses":[{"pos":"名詞","definition":"教會羅馬字。三四百年前，基督宗教的西洋傳教士來到南洋、中國、臺灣等地，因為當時東方人的教育不普及，他們便利用羅馬字母系統來拼寫當地的口語白話，以翻譯聖經、聖詩，編寫教材、文學作品，方便向民眾宣教。又稱作「教會羅馬字」，簡稱「教羅」。早年教會人士常將文言漢文字稱為「孔子字」(Khóng-tsú-jī)，將官話漢文字稱為「唐人字」(Tn̂g-lâng-jī), 將書寫在地白話的教會羅馬字稱為「白話字」（教羅寫法是 Pe̍h-ōe-jī，目前的討論者常簡寫為 POJ）。廈門話及臺灣台語的白話字累積了特別豐富的文獻，至今也仍有愛用者、推廣者，早已超出教會的範圍。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/13982","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14056,"newId":14016,"hanzi":"百百款","tailo":"pah-pah-khuán","wordType":"主詞目","senses":[{"pos":"名詞","definition":"許多不同的式樣和種類。","examples":[{"hanzi":"人的性情是百百款。","tailo":"Lâng ê sìng-tsîng sī n":"扯鈴。","examples":[{"hanzi":"伊真𠢕拍風雷。","tailo":"I tsin gâu phah hong-luî.","mandarin":"他很會玩扯鈴。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14173","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14215,"newId":14174,"hanzi":"食人夠夠","tailo":"tsia̍h-lâng-kàu-kàu","wordType":"主詞目","senses":[{"pos":"熟語","definition":"欺人太甚。","examples":[{"hanzi":"若毋是伊食人夠夠，逐家嘛袂佮伊計較。","tailo":"Nā m̄ sī i tsia̍h-lâng-kàu-kàu, ta̍k-ke mā bē kah i kè-kàu.","mandarin":"要不是他欺人太甚，大家也不會跟他計較。"}]},{"pos":"熟語","definition":"霸道又用奸巧的手段來取得不法的利益。","examples":[{"hanzi":"靠勢伊是大官虎，食人夠夠。","tailo":"Khò-sè i sī tuā-kuann-hóo, tsia̍h-lâng-kàu-kàu.","mandarin":"仗著他是大官，魚肉百姓。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14174","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14220,"newId":14179,"hanzi":"食罪","tailo":"tsia̍h-tsuē","wordType":"主詞目","senses":[{"pos":"動詞","definition":"認罪並接受法律制裁。","examples":[{"hanzi":"犯法的人，隨時愛準備食罪。","tailo":"Huān-huat ê lâng, suî-sî ài tsún-pī tsia̍h-tsuē.","mandarin":"犯罪的人，要隨時有認罪並接受法律制裁的準備。"}]},{"pos":"動詞","definition":"為人頂罪；代人入監服刑。","examples":[{"hanzi":"老爸疼囝，替囝食罪。","tailo":"Lāu-pē thiànn kiánn, thè kiánn tsia̍h-tsuē.","mandarin":"父親疼愛兒子，為他的兒子頂罪。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14179","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14216,"newId":14175,"hanzi":"食老出癖","tailo":"tsia̍h-lāu-tshut-phia̍h","wordType":"主詞目","senses":[{"pos":"熟語","definition":"活到一大把年紀才出麻疹，比喻老了才做出反常的行徑，或是性情大變。","examples":[{"hanzi":"伊做十一哥五十冬矣，這馬才想欲娶某，人講伊是食老出癖。","tailo":"I tsò tsa̍p-it-ko gōo-tsa̍p tang--ah, tsit-má tsiah siūnn-beh tshuā-bóo, lâng kóng i sī tsia̍h-lāu-tshut-phia̍h.","mandarin":"他當了五十年的光棍，現在才想要結婚，人家說他是老了才出麻疹。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14175","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14224,"newId":14183,"hanzi":"食聲","tailo":"tsia̍h-siann","wordType":"主詞目","senses":[{"pos":"動詞","definition":"虛張聲勢。","examples":[{"hanzi":"伊其實啥代誌攏袂曉，怙一支喙咧食聲爾爾。","tailo":"I kî-si̍t siánn tāi-tsì lóng bē-hiáu, kōo tsi̍t ki tshuì teh tsia̍h-siann niā-niā.","mandarin":"他其實什麼事情都不會，單憑一張嘴虛張聲勢而已。"}]},{"pos":"動詞","definition":"用假的主張來欺騙人。","examples":[{"hanzi":"你講手指月娘會予月娘割耳仔，彼是欲騙囡仔的，我予你袂食聲得。","tailo":"Lí kóng tshiú kí gue̍h-niû ē hōo gue̍h-niû kuah hīnn-á, he sī beh phiàn gín-á--ê, guá hōo lí bē-tsia̍h-siann--tit.","mandarin":"你說手指月亮會被月亮割耳朵，那是要騙小孩的，你別想騙我。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14183","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14219,"newId":14178,"hanzi":"食茶","tailo":"tsia̍h-tê","wordType":"主詞目","senses":[{"pos":"動詞","definition":"喝茶。","examples":[{"hanzi":"食冰喝涼，食茶喝燒。","tailo":"Tsia̍h ping huah liâng, tsia̍h-tê huah sio.","mandarin":"吃冰喊冷，喝茶喊燙。俗語，形容只顧自己享受，不管別人死活。"}]},{"pos":"動詞","definition":"「食新娘茶」(tsia̍h sin-niû-tê)的簡稱。婚宴之後，新娘端茶出來請大家喝，藉以拜見公公和婆婆，同時也和親族相見；奉茶時，要講好話，並以紅包回禮。","examples":[{"hanzi":"廳堂專人客，男女數千个，喜酒食真濟，聽候閣食茶。","tailo":"Thiann-tn̂g tsuan lâng-kheh, lâm-lí sòo tshing ê, hí-tsiú tsia̍h tsin tsē, thìng-hāu koh tsia̍h-tê.","mandarin":"大廳都是客人，男女好幾千個，酒席吃喝多了，等待再喝新娘茶。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14178","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14221,"newId":14180,"hanzi":"食認","tailo":"tsia̍h-jīn/tsia̍h-līn","wordType":"主詞目","senses":[{"pos":"動詞","definition":"承認、負責。","examples":[{"hanzi":"代誌這馬出破矣，家己毋食認，閣硬欲賴予別人，實在無理。","tailo":"Tāi-tsì tsit-má tshut-phuà--ah, ka-kī m̄ tsia̍h-jīn, koh ngē beh luā hōo pa̍t-lâng, si̍t-tsāi bô-lí.","mandarin":"現在事機敗露了，自己不承擔，還硬要賴給別人，實在沒道理。"}]},{"pos":"動詞","definition":"招認、認罪。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14180","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14217,"newId":14176,"hanzi":"食重鹹","tailo":"tsia̍h-tāng-kiâm","wordType":"主詞目","senses":[{"pos":"熟語","definition":"吃得很鹹。指喜歡重口味的食物。","examples":[{"hanzi":"你腰子無好，著比正常人食閣較汫，袂使像往過遐愛食重鹹。","tailo":"Lí io-tsí bô hó, tio̍h pí tsìng-siông-lâng tsia̍h koh-khah tsiánn, bē- ,"missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14302,"newId":14255,"hanzi":"鬼頭刀","tailo":"kuí-thâu-to","wordType":"主詞目","senses":[{"pos":"名詞","definition":"鯕鰍。魚類。屬遠洋魚類，常活動在溫暖水域表層，體長可達一公尺多，是食用魚，肉白色，味道較淡，可做成生魚片、魚丸、魚鬆等加工食品。常追逐獵食飛魚，故有「飛烏虎」(pue-oo-hóo)的別名。","examples":[]},{"pos":"名詞","definition":"一種古代的兵器。刀體沉重，相當鋒利，適合用來斬首。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14255","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14350,"newId":14303,"hanzi":"魚酥","tailo":"hî-soo/hû-soo","wordType":"主詞目","senses":[{"pos":"名詞","definition":"用魚肉炒製成的魚肉鬆。","examples":[{"hanzi":"家己做魚酥，會使穩心仔食。","tailo":"Ka-kī tsò hî-soo, ē-sái ún-sim-á tsia̍h.","mandarin":"自家炒製魚肉鬆，可以安心地吃。"}]},{"pos":"名詞","definition":"一種臺灣常見的魚肉加工食品。將魚肉、魚骨打成漿，加入麵粉、地瓜粉和其他醬料混合，再切成條狀或片狀，油炸成酥脆的食品。","examples":[{"hanzi":"淡水咧賣的魚酥真好食。","tailo":"Tām-tsuí teh bē ê hî-soo tsin hó-tsia̍h.","mandarin":"淡水在賣的魚酥很好吃。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14303","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14566,"newId":14514,"hanzi":"鮢鱖","tailo":"tsu-kuè/tsu-kè","wordType":"主詞目","senses":[{"pos":"名詞","definition":"鞍帶石斑魚。魚類。俗稱「龍膽石斑」。一種高經濟價值的食用魚，是石斑魚類中體型最大者，故也稱為「斑王」。「鮢鱖」是南部說法，北部講「石斑」。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14514","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14351,"newId":14304,"hanzi":"鳥隻","tailo":"tsiáu-tsiah","wordType":"主詞目","senses":[{"pos":"名詞","definition":"鳥兒。原指單隻的鳥，後引申為泛稱。","examples":[{"hanzi":"田園若有收，鳥隻食得偌？","tailo":"Tshân-hn̂g nā ū siu, tsiáu-tsiah tsia̍h-tit guā?","mandarin":"田園如果有收成，鳥兒能吃得了多少呢？俗語，指老闆如果賺錢，對待員工就不應該太過刻薄。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14304","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14353,"newId":14306,"hanzi":"鳥鼠仔糖","tailo":"niáu-tshí-á-thn̂g/niáu-tshú-á-thn̂g","wordType":"主詞目","senses":[{"pos":"名詞","definition":"新港飴，一種新港特產的花生糖。用麥芽糖、白砂糖、麵粉及花生仁等熬煮兩三小時製成的凝膠澱粉軟糖。","examples 名詞","definition":"桑椹。","examples":[{"hanzi":"鹽桑仔大出的時，挽袂赴，落甲規塗跤。","tailo":"Iâm-sng-á tuā-tshut ê sî, bán bē-hù, lak kah kui thôo-kha.","mandarin":"桑椹盛產的時候，來不及採摘，掉得滿地都是。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14559","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14615,"newId":14560,"hanzi":"鹽酸仔","tailo":"iâm-sng-á","wordType":"主詞目","senses":[{"pos":"名詞","definition":"臺灣酢醬草。","examples":[{"hanzi":"鹽酸仔足臭賤的，真𠢕生湠。","tailo":"Iâm-sng-á tsiok tshàu-tsiān--ê, tsin gâu senn-thuànn.","mandarin":"酢醬草生命力強，很容易生長繁殖。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14560","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14586,"newId":14531,"hanzi":"麒麟鹿","tailo":"kî-lîn-lo̍k","wordType":"主詞目","senses":[{"pos":"名詞","definition":"長頸鹿。哺乳動物。原產於非洲撒哈拉沙漠以南的平原地帶。外形與鹿相似，腿和頸部則較一般鹿來得長。毛色為淺黃色，並帶有淺褐色斑點。大多生活於平原和灌木地區，以金合歡屬植物的葉子為主要食物。","examples":[{"hanzi":"囡仔佇動物園看著麒麟鹿，就歡喜甲跳起來。","tailo":"Gín-á tī tōng-bu̍t-hn̂g khuànn-tio̍h kî-lîn-lo̍k, tō huann-hí kah thiàu--khí-lâi.","mandarin":"小孩子在動物園看到長頸鹿，就高興得跳起來。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14531","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14411,"newId":14363,"hanzi":"黃目子","tailo":"n̂g-ba̍k-tsí","wordType":"主詞目","senses":[{"pos":"名詞","definition":"無患子，植物名。果皮可以用來做肥皂。","examples":[{"hanzi":"黃目子會使用來做雪文。","tailo":"N̂g-ba̍k-tsí ē-sái īng-lâi tsò sap-bûn.","mandarin":"無患子可以用來製造肥皂。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14363","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14567,"newId":14515,"hanzi":"點拄","tailo":"tiám-tuh","wordType":"主詞目","senses":[{"pos":"動詞","definition":"點醒、暗示。","examples":[{"hanzi":"你若看伊做了毋著，著共伊點拄一下。","tailo":"Lí nā khuànn i tsò liáu m̄-tio̍h, tio̍h kā i tiám-tuh--tsi̍t-ē.","mandarin":"你要是發現他做錯了，得提點他一下。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14515","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14555,"newId":14504,"hanzi":"龜龜鱉鱉","tailo":"ku-ku-pih-pih","wordType":"主詞目","senses":[{"pos":"形容詞","definition":"形容個性彆扭，不乾不脆。","examples":[{"hanzi":"這个人客龜龜鱉鱉，買一種物件轉來換三逝。","tailo":"Tsit ê lâng-kheh ku-ku-pih-pih, bé tsi̍t tsióng mi̍h-kiānn tńg-lâi uānn sann tsuā.","mandarin":"這個客人不乾不脆，買一個東西回來換三次。"}]},{"pos":"形容詞","definition":"形容人神神祕祕、遮遮掩掩，好像有不可告人的事的樣子。","examples":[{"hanzi":"伊最近變甲龜龜鱉鱉，問伊按怎，閣吞吞吐吐，毋知咧變啥魍。","tailo":"I tsuè-kīn piàn kah ku-ku-pih-pih, mn̄g i án-tsuánn, koh thun-thun-thòo-thòo, m̄ tsai teh pìnn-siánn-báng.","mandarin":"他最近變得神神祕祕的，問他怎麼了，又吞吞吐吐的，不知道在搞什麼飛機。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14504","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14475,"newId":14427,"hanzi":"𠞭花","tailo":"liô-hue","wordType":"主詞目","senses":[{"pos":"動詞","definition":"用刀子在豬腎臟或烏賊片上割劃花紋。這樣較快煮好，外觀、口感也較佳。","examples":[]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14427","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14618,"newId":14563,"hanzi":"𣻸塌塌","tailo":"siûnn-lap-lap","wordType":"主詞目","senses":[{"pos":"形容詞","definition":"非常黏滑、溼滑的樣子。","examples":[{"hanzi":"彼間餐廳，椅桌、塗跤一四界𣻸塌塌，真無衛生。","tailo":"Hit king tshan-thiann, í-toh, thôo-kha tsi̍t-sì-kè siûnn-lap-lap, tsin bô uē-sing.","mandarin":"那間餐廳，桌椅、地面到處溼滑油膩，很不衛生。"},{"hanzi":"這幾日雨澹水滴，路不時攏𣻸塌塌。","tailo":"Tsit kuí ji̍t hōo-tâm-tsuí-tih, lōo put-sî lóng siûnn-lap-lap.","mandarin":"這幾天淫雨霏霏，路面常常都很溼滑。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14563","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14162,"newId":14122,"hanzi":"𤆬領","tailo":"tshuā-niá","wordType":"主詞目","senses":[{"pos":"動詞","definition":"帶領。","examples":[{"hanzi":"心聲合唱團攏是張先生咧𤆬領。","tailo":"Sim-siann ha̍p-tshiùnn-thuân lóng sī Tiunn--sian-sinn teh tshuā-niá.","mandarin":"心聲合唱團都是張先生在帶領。"}]}],"url":"https://sutian.moe.edu.tw/und-hani/su/14122","missingInOds":false,"inLatestOds":true,"hideSutianSelfLink":false},{"oldId":14163,"newId":14123,"hanzi":"𨑨迌印仔","tailo":"tshit-thô-ìn-á/thit-thô-ìn-á","wordType":"主詞目","senses":[   <script>
(function () {
  const DATA = JSON.parse(document.getElementById("payload").textContent);
  const tabsEl = document.getElementById("tabs");
  const gridEl = document.getElementById("grid");
  const qEl = document.getElementById("q");
  const bannerEl = document.getElementById("banner");

  function posClass(pos) {
    if (!pos) return "tag-pos-default";
    const key = pos.replace(/\s+/g, "");
    const map = {
      "名詞": "tag-pos-名詞", "動詞": "tag-pos-動詞", "形容詞": "tag-pos-形容詞",
      "副詞": "tag-pos-副詞", "數詞": "tag-pos-數詞", "量詞": "tag-pos-量詞",
      "代詞": "tag-pos-代詞", "助詞": "tag-pos-助詞", "嘆詞": "tag-pos-嘆詞",
      "連詞": "tag-pos-連詞", "介詞": "tag-pos-介詞"
    };
    return map[key] || "tag-pos-default";
  }

  function esc(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function cardHtml(e) {
    const senses = (e.senses || []).map((s, idx) => {
      const exs = (s.examples || []).map(ex => `
        <div class="ex">
          <p class="h">${esc(ex.hanzi)}</p>
          <p class="r">${esc(ex.tailo)}</p>
          <p class="m">${esc(ex.mandarin)}</p>
        </div>`).join("");
      return `
        <section class="sense">
          <span class="tag ${posClass(s.pos)}">${esc(s.pos) || "（詞性未標）"}</span>
          <p class="def">${esc(s.definition)}</p>
          ${exs}
        </section>`;
    }).join("");
    const miss = e.missingInOds
      ? `<p class="meta-missing">此詞目在最新辭典已經移除</p><p class="relation-note">《${esc(DATA.ods)}》詞目表無此詞目 id；畫面上漢字、台羅來自 diff-yearly added.csv，僅供參考。</p>`
      : "";
    const wt = e.wordType
      ? `<div class="type-row"><span class="tag tag-pos-default">${esc(e.wordType)}</span></div>`
      : "";
    let relHtml = "";
    if (e.relationSearched) {
      const items = (e.relationLinks || []).map(r => {
        const dictBlock = r.partnerUrl
          ? `<div class="relation-partner-dict"><a href="${esc(r.partnerUrl)}" target="_blank" rel="noopener">教典詞目 id ${r.partnerNewId}</a><div class="r-url">${esc(r.partnerUrl)}</div></div>`
          : `<div class="relation-partner-dict"><span class="relation-note">主編碼 ${r.partnerOldId} 在 id-mapping/old_to_new_id.csv 無對應，無新版教典連結。</span></div>`;
        return `<li><span class="tag tag-pos-default">${esc(r.kind)}</span> ${esc(r.hanzi)} <span class="r">${esc(r.tailo)}</span> <small>（主編碼 ${r.partnerOldId}）</small>${dictBlock}</li>`;
      }).join("");
      const emptyNote = (e.relationLinks && e.relationLinks.length)
        ? ""
        : `<p class="relation-note">近義／反義對應表未列與此主編碼相連之列。</p>`;
      relHtml = `<div class="relation-block"><h3>對應主詞目（近義／反義表反查）</h3><ul>${items || ""}</ul>${emptyNote}<p class="relation-note">${esc(e.relationSourceNote || "")}</p></div>`;
    }
    const selfLinkBlock = e.missingInOds
      ? ""
      : e.hideSutianSelfLink
      ? ``
      : `<a class="permalink" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url)}</a>`;
    return `
      <article class="card" data-q="${esc([e.hanzi, e.tailo, (e.senses||[]).map(x=>x.definition).join(" "), ((e.relationLinks||[]).map(r=>[r.hanzi,r.tailo,r.partnerUrl,r.partnerNewId].filter(Boolean).join(" ")).join(" "))].join(" "))}">
        <h2>${esc(e.hanzi)}</h2>
        <p class="tailo">${esc(e.tailo)}</p>
        ${selfLinkBlock}
        ${wt}
        ${miss}
        ${relHtml}
        ${senses}
      </article>`;
  }

  let active = 0;

  function render() {
    const batch = DATA.batches[active];
    const q = (qEl.value || "").trim().toLowerCase();
    let entries = batch.entries;
    if (q) {
      entries = entries.filter(e => {
        const hay = [
          e.hanzi, e.tailo, e.newId, e.oldId,
          ...(e.senses || []).flatMap(s => [s.pos, s.definition, ...(s.examples||[]).flatMap(x => [x.hanzi, x.tailo, x.mandarin])]),
          ...((e.relationLinks || []).flatMap(r => [r.hanzi, r.tailo, r.kind, String(r.partnerOldId), r.partnerUrl, r.partnerNewId != null ? String(r.partnerNewId) : ""]))
        ].join(" ").toLowerCase();
        return hay.includes(q);
      });
    }
    gridEl.innerHTML = entries.map(cardHtml).join("") || '<p class="sub">沒有符合的詞目。</p>';
  }

  function renderTabs() {
    tabsEl.innerHTML = DATA.batches.map((b, i) =>
      `<button type="button" class="tab ${i===active?"active":""}" data-i="${i}">${esc(b.label)} <small>（${b.count}）</small></button>`
    ).join("");
    tabsEl.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        active = +btn.getAttribute("data-i");
        qEl.value = "";
        renderTabs();
        render();
      });
    });
    const cur = tabsEl.querySelector(".tab.active");
    if (cur) cur.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
  }

  qEl.addEventListener("input", () => render());
  renderTabs();
  render();
})();
  </script>
